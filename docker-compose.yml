services:
  db:
    image: postgres:17-alpine
    container_name: board-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board}
      POSTGRES_DB: ${POSTGRES_DB:-board}
    ports:
      # Bound to localhost only, so the DB is not exposed to your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - board-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  board-db-data:
